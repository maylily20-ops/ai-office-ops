<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤슬향방 | 다녀가신 분들의 향</title>
  <meta name="description" content="포항 영일대 해변 걸어서 5분, 골목 2층 향수 공방. 어려운 용어 없이 대화로 나만의 향을 찾는 원데이 조향 클래스.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="윤슬향방">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="윤슬향방 | 다녀가신 분들의 향">
  <meta property="og:description" content="포항 영일대 해변 걸어서 5분, 골목 2층 향수 공방. 어려운 용어 없이 대화로 나만의 향을 찾는 원데이 조향 클래스.">
  <meta property="og:url" content="https://내주소/works.html">
  <meta property="og:image" content="https://내주소/images/work1.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #F5EFE4;
      --text: #2F4A3F;
      --sub: #8FA89A;
      --accent: #C9A35B;
      --card-bg: #FAF6EE;
      --placeholder-bg: #E5E2DC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 17px;
      line-height: 1.65;
      word-break: keep-all;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 위 메뉴 (index.html · class.html과 동일) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      border-bottom: 1px solid rgba(143, 168, 154, 0.35);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 56px;
      white-space: nowrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 1;
    }

    .main-nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 5px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .header-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 10px;
      background-color: var(--accent);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      flex-shrink: 0;
    }

    /* 작품 상세 (크게 보기) */
    .works-section {
      padding: 40px 0 64px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 32px;
      color: var(--text);
    }

    .works-large-list {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .work-large-item {
      background-color: var(--card-bg);
      border: 1px solid rgba(143, 168, 154, 0.5);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .photo-frame {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--placeholder-bg);
      position: relative;
      aspect-ratio: 16 / 10;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background-color: var(--placeholder-bg);
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
      padding: 24px;
      text-align: center;
    }

    .photo-frame.is-missing img {
      display: none;
    }

    .photo-frame.is-missing .photo-fallback {
      display: flex;
    }

    .work-large-caption {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      padding: 4px 4px 6px;
    }

    /* 맨 아래 (index.html · class.html과 동일) */
    .site-footer {
      padding: 36px 0 48px;
      border-top: 1px solid rgba(143, 168, 154, 0.4);
      font-size: 14px;
      line-height: 1.7;
    }

    .footer-info {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .footer-ai-notice {
      font-size: 14px;
    }

    /* 넓은 화면 (최대 1100px 안으로) */
    @media (min-width: 768px) {
      .header-inner {
        padding: 0 16px;
        gap: 16px;
      }

      .brand {
        font-size: 18px;
      }

      .main-nav {
        gap: 12px;
      }

      .main-nav a {
        font-size: 16px;
        padding: 0 10px;
      }

      .header-cta {
        font-size: 15px;
        padding: 0 16px;
      }

      .page-title {
        font-size: 36px;
        margin-bottom: 40px;
      }

      .work-large-item {
        padding: 32px;
        gap: 24px;
      }

      .photo-frame {
        min-height: 420px;
      }

      .work-large-caption {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- 위 메뉴 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">윤슬향방</a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="index.html#about">소개</a>
        <a href="index.html#class">클래스</a>
        <a href="works.html">작품</a>
        <a href="index.html#news">소식</a>
        <a href="index.html#contact">문의</a>
      </nav>
      <a href="index.html#contact" class="header-cta">예약 문의</a>
    </div>
  </header>

  <main>
    <section class="works-section">
      <div class="container">
        <h1 class="page-title">다녀가신 분들의 향</h1>
        <div class="works-large-list">
          <figure class="work-large-item">
            <div class="photo-frame">
              <img src="images/work1.jpg" alt="바다 냄새를 담은 한 병" onerror="this.parentElement.classList.add('is-missing')">
              <div class="photo-fallback">work1.jpg</div>
            </div>
            <figcaption class="work-large-caption">바다 냄새를 담은 한 병</figcaption>
          </figure>

          <figure class="work-large-item">
            <div class="photo-frame">
              <img src="images/work2.jpg" alt="조금씩 맡아 보며 맞춘 비율" onerror="this.parentElement.classList.add('is-missing')">
              <div class="photo-fallback">work2.jpg</div>
            </div>
            <figcaption class="work-large-caption">조금씩 맡아 보며 맞춘 비율</figcaption>
          </figure>

          <figure class="work-large-item">
            <div class="photo-frame">
              <img src="images/work3.jpg" alt="비 오는 토요일, 두 분이 고른 향" onerror="this.parentElement.classList.add('is-missing')">
              <div class="photo-fallback">work3.jpg</div>
            </div>
            <figcaption class="work-large-caption">비 오는 토요일, 두 분이 고른 향</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <!-- 맨 아래 -->
  <footer class="site-footer">
    <div class="container">
      <ul class="footer-info">
        <li>상호: 윤슬향방</li>
        <li>대표자: 김윤슬</li>
        <li>사업자등록번호: 12345678</li>
        <li>주소: 포항 영일대 해변에서 걸어서 5분, 골목 2층 · 123-567</li>
        <li>이메일: yoonseol@1234567</li>
      </ul>
      <p class="footer-ai-notice">일부 사진은 AI로 만들었습니다</p>
    </div>
  </footer>

  <script>
    // 사진이 없을 때 파일 이름 상자 표시 보정
    document.querySelectorAll('.photo-frame img').forEach(function (img) {
      if (img.complete && img.naturalWidth === 0) {
        img.parentElement.classList.add('is-missing');
      }
    });
  </script>
</body>
</html>
